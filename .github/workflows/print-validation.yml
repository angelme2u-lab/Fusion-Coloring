name: Validate PDF layout
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test_quality_ui.cjs
      - run: python -m pip install Pillow
      - run: python -m unittest -v test_generation.py test_print_placement.py
      - run: python -m py_compile folio_press.py
